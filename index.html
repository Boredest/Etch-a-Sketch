<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="styles.css" />
    <title>Etch-a-Sketch</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Roboto:ital,wght@0,100..900;1,100..900&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <header>
      <h1 class="title">Etch-a-Sketch!</h1>
    </header>
    <main class="main">
      <section class="settings">
        <input
          type="color"
          id="brush-color"
          name="brushColor"
          value="#000000"
        />
        <button id="rainbow">Rainbow Mode</button>
        <button id="color">Color Mode</button>
        <button id="eraser">Eraser</button>
        <button id="clear">Clear</button>
        <label for="grid-size">Grid Size</label>
        <div class="slider-value">16 x 16</div>
        <input
          type="range"
          class="slider"
          name="size"
          min="1"
          max="64"
          value="16"
        />
      </section>
      <section class="grid-container"></section>
      <section class="spacer"></section>
    </main>
    <footer class="footer">
      Copyright ©
      <script>
        document.write(new Date().getFullYear());
      </script>
      Boredest
      <a href="https://github.com/boredest">
        <img class="github-logo" src="github-logo.svg" alt="Github Logo" />
      </a>
    </footer>
    <script src="app.js"></script>
  </body>
</html>
